<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>상훈과 연희의 결혼식에 초대합니다</title>

    <!-- 카카오톡 및 메신저 공유 OG(Open Graph) 메타태그 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yonizzang.github.io/wedding/">
    <meta property="og:title" content="상훈과 연희의 결혼식에 초대합니다">
    <meta property="og:description" content="2026. 11. 21. SAT. 11:30AM. 틸티드한남">
    <meta property="og:image" content="https://yonizzang.github.io/wedding/images/og_ver3.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Card 메타태그 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="상훈과 연희의 결혼식에 초대합니다">
    <meta name="twitter:description" content="2026. 11. 21. SAT. 11:30AM. 틸티드한남">
    <meta name="twitter:image" content="https://yonizzang.github.io/wedding/images/og_ver3.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Pretendard Variable", Pretendard, sans-serif;
            background-color: #F1EBE6;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            word-break: keep-all;
        }

        body.no-scroll {
            overflow: hidden !important;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
        }

        /* 오프닝 봉투 영역 */
        .envelope-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #F1EBE6;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            cursor: pointer;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .envelope-container {
            position: relative;
            width: 82%;
            max-width: 320px;
            margin: 0 auto;
            text-align: center;
        }

        .envelope-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        @keyframes floatUpWiggle {
            0% { transform: translateY(3px) rotate(0deg); }
            25% { transform: translateY(1px) rotate(-0.5deg); }
            50% { transform: translateY(0px) rotate(0.5deg); }
            75% { transform: translateY(-1px) rotate(-0.3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .envelope-container.wiggle-motion {
            animation: floatUpWiggle 0.8s ease-in-out forwards;
        }

        .envelope-wrapper.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 메인 컨텐츠 영역 */
        .main-content {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            width: 100%;
            justify-content: center;
        }

        .main-content.active {
            display: flex;
            opacity: 1;
        }

        .wrapper {
            width: 100%;
            max-width: 430px;
            background-color: #f8f6f0;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
            overflow-x: hidden;
        }

        section.main_hero,
        section.invitation,
        section.greeting,
        section.calendar,
        section.thankyou {
            padding: 0 !important;
            border-bottom: none !important;
            width: 100%;
            height: auto;
            overflow: hidden;
        }

        section.main_hero img,
        section.invitation img,
        section.greeting img,
        section.calendar img,
        section.thankyou img {
            width: 100%;
            height: auto;
            display: block;
        }

        section.location {
            padding: 0 !important;
            border-bottom: none !important;
            width: 100%;
        }

        .location-container {
            position: relative;
            width: 100%;
        }

        .location-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .map-overlay-buttons {
            position: absolute;
            bottom: 4.5%;
            left: 5%;
            right: 5%;
            height: 10%;
            display: flex;
            gap: 3.5%;
        }

        .transparent-btn {
            flex: 1;
            height: 100%;
            display: block;
            background: transparent;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        }

        /* Gallery 섹션 스타일 */
        section.gallery {
            padding: 0 !important;
            border-bottom: none !important;
            width: 100%;
            background-image: url('https://yonizzang.github.io/wedding/images/bg_paper_02.png');
            background-size: 100% auto;
            background-repeat: repeat-y;
            background-position: top center;
            background-color: #f8f6f0;
            position: relative;
        }

        .gallery-header-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-inner {
            padding: 0 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 0 !important;
        }

        .gallery-item {
            width: 100%;
            aspect-ratio: 100 / 150;
            overflow: hidden;
            background-color: #eee;
            cursor: pointer;
            display: none;
        }

        .gallery-item.visible {
            display: block;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.03);
        }

        .gallery-toggle-wrap {
            text-align: center;
            margin-top: 30px;
            padding-bottom: 40px;
        }

        .gallery-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: inline-block;
            outline: none;
            padding: 0;
        }

        .gallery-toggle-btn img.btn-more-img {
            width: 58px !important;
            height: 17px !important;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        .gallery-toggle-btn img.btn-folde-img {
            width: 46px !important;
            height: 17px !important;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        /* 라이트박스 모달 */
        .lightbox-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: #F1EBE6 !important;
            z-index: 9999999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            touch-action: pan-y;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-content-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            max-height: 78vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent !important;
            overflow: hidden;
            user-select: none;
            border: none !important;
            box-shadow: none !important;
        }

        .lightbox-image {
            max-width: 100%;
            max-height: 78vh;
            object-fit: contain;
            display: block;
            background-color: transparent !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
            margin: 0 auto;
            mix-blend-mode: multiply; /* 이미지의 배경과 모달 배경 조화 */
        }

        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 22px;
            height: 22px;
            z-index: 10000;
        }

        .lightbox-close img {
            width: 22px !important;
            height: 22px !important;
            display: block;
            object-fit: contain;
            filter: invert(53%) sepia(0%) saturate(0%) hue-rotate(188deg) brightness(95%) contrast(89%); /* #7E7E7E 컬러 적용 */
        }

        .lightbox-counter {
            color: #1a1a1a;
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 22px;
            height: 22px;
            z-index: 10000;
        }

        .lightbox-nav img {
            width: 22px !important;
            height: 22px !important;
            display: block;
            object-fit: contain;
            filter: invert(53%) sepia(0%) saturate(0%) hue-rotate(188deg) brightness(95%) contrast(89%); /* #7E7E7E 컬러 적용 */
        }

        .lightbox-prev { left: 8px; }
        .lightbox-next { right: 8px; }

        /* Account 섹션 스타일 */
        section.account-section {
            padding: 0 0 0px 0 !important;
            border-bottom: none !important;
            width: 100%;
            background: url('https://yonizzang.github.io/wedding/images/bg_paper_02.png') repeat center top / contain;
            background-color: #f8f6f0;
        }

        .account-header-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .account-accordion-group {
            width: 88%;
            margin: 0 auto 40px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .acc-item {
            width: 100%;
        }

        .acc-btn {
            width: 100%;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            display: block;
            outline: none;
        }

        .acc-btn img {
            width: 100%;
            height: auto;
            display: block;
        }

        .acc-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .acc-panel-inner {
            position: relative;
            width: 100%;
            padding-top: 8px;
        }

        .acc-panel-inner img {
            width: 100%;
            height: auto;
            display: block;
        }

        .copy-btn-layer {
            position: absolute;
            top: 8px;
            left: 0;
            width: 100%;
            height: calc(100% - 8px);
        }

        .copy-trigger-btn {
            position: absolute;
            right: 4%;
            width: 25%;
            height: 28%;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .copy-trigger-btn.pos-1 { top: 4%; }
        .copy-trigger-btn.pos-2 { top: 36%; }
        .copy-trigger-btn.pos-3 { top: 68%; }

        .account-bottom-bar {
            margin: 0;
            width: 100%;
            display: block;
            line-height: 0;
        }

        .account-bottom-bar img {
            width: 100%;
            height: auto;
            display: block;
        }

        .toast-popup {
            visibility: hidden;
            min-width: 220px;
            background-color: rgba(40, 40, 40, 0.88);
            color: #fff;
            text-align: center;
            border-radius: 25px;
            padding: 12px 20px;
            position: fixed;
            z-index: 9999999;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
            pointer-events: none;
        }

        .toast-popup.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="envelope-wrapper" class="envelope-wrapper">
        <div id="envelope-container" class="envelope-container">
            <img id="envelope-img" src="https://yonizzang.github.io/wedding/images/index_card_ver3_01.png" alt="편지봉투" class="envelope-img">
        </div>
    </div>

    <main id="main-content" class="main-content">
        <div class="wrapper">
            <section class="main_hero">
                <img src="https://yonizzang.github.io/wedding/images/main_hero_final_02.png" alt="Wedding Main Hero">
            </section>

            <section class="invitation">

            <section class="greeting">
                <img src="https://yonizzang.github.io/wedding/images/greeting_03.png" alt="Greeting Details">
            </section>

            <section class="calendar">

            </section>

            <section class="location">

                        <a href="https://m.map.naver.com/search2/search.naver?query=%EC%84%9C%EC%9A%B8%20%EC%9A%A9%EC%82%B0%EA%B5%AC%20%ED%95%9C%EB%82%A8%EB%8C%80%EB%A1%9C%20150-10" target="_blank" class="transparent-btn" title="네이버지도 열기"></a>
                    </div>
                </div>
            </section>

            <section class="gallery">
                <img src="https://yonizzang.github.io/wedding/images/gallery_02.png" alt="Gallery Title" class="gallery-header-img">
                <div class="gallery-inner">

                    <div class="gallery-toggle-wrap">
                        <button type="button" class="gallery-toggle-btn" id="galleryToggleBtn" onclick="toggleGallery()">
                            <img src="https://yonizzang.github.io/wedding/images/btn_more.png" alt="더보기" id="toggleIcon" class="btn-more-img">
                        </button>

                </div>

                <div class="account-bottom-bar">
                    <img src="https://yonizzang.github.io/wedding/images/bottom_bar.png" alt="구분선">

            <section class="account-section">
                <img src="https://yonizzang.github.io/wedding/images/account_01_header.png" alt="마음 전하실 곳" class="account-header-img">

                <div class="account-accordion-group">

                            <img id="img-btn-groom" src="https://yonizzang.github.io/wedding/images/btn_account_groom_default.png" alt="신랑측에게">

                            <div class="acc-panel-inner">

                                <div class="copy-btn-layer">
                                    <button type="button" class="copy-trigger-btn pos-1" onclick="copyAccount('하나은행 593-910418-97107', event)"></button>

                                    <button type="button" class="copy-trigger-btn pos-3" onclick="copyAccount('하나은행 144-891640-05907', event)"></button>

                    </div>

                    <div class="acc-item">
                        <button type="button" class="acc-btn" onclick="toggleAcc('bride')">
                            <img id="img-btn-bride" src="https://yonizzang.github.io/wedding/images/btn_account_bride_default.png" alt="신부측에게">
                        </button>
                        <div id="panel-bride" class="acc-panel">
                            <div class="acc-panel-inner">
                                <img src="https://yonizzang.github.io/wedding/images/account_bride_content.png" alt="신부측 계좌">

                                    <button type="button" class="copy-trigger-btn pos-1" onclick="copyAccount('신한은행 110-437-813215', event)"></button>
                                    <button type="button" class="copy-trigger-btn pos-2" onclick="copyAccount('농협은행 201017-52-114748', event)"></button>
                                    <button type="button" class="copy-trigger-btn pos-3" onclick="copyAccount('기업은행 43900-9869-01-016', event)"></button>

            <section class="thankyou">

    </main>

    <div id="lightboxModal" class="lightbox-modal">
        <button class="lightbox-close" onclick="closeLightbox()">
            <img src="https://yonizzang.github.io/wedding/images/btn_close.png" alt="닫기">
        </button>
        <div class="lightbox-counter" id="lightboxCounter">1 / 30</div>
        <div class="lightbox-content-wrap" id="lightboxContentWrap">
            <button class="lightbox-nav lightbox-prev" onclick="changeImage(-1)">
                <img src="https://yonizzang.github.io/wedding/images/btn_left.png" alt="이전">
            </button>
            <img id="lightboxImg" class="lightbox-image" src="" alt="상세보기 이미지">
            <button class="lightbox-nav lightbox-next" onclick="changeImage(1)">
                <img src="https://yonizzang.github.io/wedding/images/btn_right.png" alt="다음">
            </button>
        </div>
    </div>

    <div id="toast" class="toast-popup">계좌번호가 복사되었습니다.</div>

    <script>
        const galleryImages = [
            "https://yonizzang.github.io/wedding/images/gallery_photo_01.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_02.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_03.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_04.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_05.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_06.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_07.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_08.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_09.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_10.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_11.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_12.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_13.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_14.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_15.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_16.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_17.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_18.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_19.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_20.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_21.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_22.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_23.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_24.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_25.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_26.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_27.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_28.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_29.jpg",
            "https://yonizzang.github.io/wedding/images/gallery_photo_30.jpg"
        ];

        let currentIndex = 0;
        let isExpanded = false;
        let scrollPosition = 0;

        function initGallery() {
            const grid = document.getElementById("galleryGrid");
            grid.innerHTML = "";

            galleryImages.forEach((src, index) => {
                const item = document.createElement("div");
                item.className = "gallery-item" + (index < 9 ? " visible" : "");
                item.onclick = () => openLightbox(index);

                const img = document.createElement("img");
                img.src = src;
                img.alt = `웨딩 사진 ${index + 1}`;

                item.appendChild(img);
                grid.appendChild(item);
            });
        }

        function toggleGallery() {
            isExpanded = !isExpanded;
            const items = document.querySelectorAll(".gallery-item");
            const toggleIcon = document.getElementById("toggleIcon");

            items.forEach((item, index) => {
                if (isExpanded) {
                    item.classList.add("visible");
                } else {
                    if (index >= 9) {
                        item.classList.remove("visible");
                    }
                }
            });

            if (isExpanded) {
                toggleIcon.src = "https://yonizzang.github.io/wedding/images/btn_folde.png";
                toggleIcon.className = "btn-folde-img";
            } else {
                toggleIcon.src = "https://yonizzang.github.io/wedding/images/btn_more.png";
                toggleIcon.className = "btn-more-img";
                document.querySelector(".gallery").scrollIntoView({ behavior: "smooth" });
            }
        }

        function openLightbox(index) {
            scrollPosition = window.scrollY || window.pageYOffset;
            currentIndex = index;
            const modal = document.getElementById("lightboxModal");
            modal.classList.add("active");
            updateLightbox();
            document.body.classList.add("no-scroll");
        }

        function closeLightbox() {
            const modal = document.getElementById("lightboxModal");
            modal.classList.remove("active");
            document.body.classList.remove("no-scroll");
            window.scrollTo(0, scrollPosition);
        }

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = galleryImages.length - 1;
            } else if (currentIndex >= galleryImages.length) {
                currentIndex = 0;
            }
            updateLightbox();
        }

        function updateLightbox() {
            const img = document.getElementById("lightboxImg");
            const counter = document.getElementById("lightboxCounter");
            img.src = galleryImages[currentIndex];
            counter.innerText = `${currentIndex + 1} / ${galleryImages.length}`;
        }

        /* 모바일 터치 스와이프 이벤트를 위한 변수 */
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener("DOMContentLoaded", function () {
            initGallery();
            document.body.classList.add("no-scroll");

            const envelopeWrapper = document.getElementById("envelope-wrapper");
            const envelopeContainer = document.getElementById("envelope-container");
            const envelopeImg = document.getElementById("envelope-img");
            const mainContent = document.getElementById("main-content");

            const imgOpen = new Image();
            imgOpen.src = "https://yonizzang.github.io/wedding/images/envelope-open_ver3.png";
            const imgCard02 = new Image();
            imgCard02.src = "https://yonizzang.github.io/wedding/images/index_card_ver3_02.png";
            const imgCard03 = new Image();
            imgCard03.src = "https://yonizzang.github.io/wedding/images/index_card_ver3_03.png";
            const imgCard04 = new Image();
            imgCard04.src = "https://yonizzang.github.io/wedding/images/index_card_ver3_04.png";

            let isOpening = false;

            function playAnimationSequence() {
                if (isOpening) return;
                isOpening = true;

                envelopeImg.src = imgOpen.src;

                setTimeout(() => { envelopeImg.src = imgCard02.src; }, 250);
                setTimeout(() => { envelopeImg.src = imgCard03.src; }, 450);
                setTimeout(() => {
                    if (envelopeContainer) envelopeContainer.classList.add("wiggle-motion");
                    envelopeImg.src = imgCard04.src;
                }, 650);

                setTimeout(() => {
                    if (mainContent) mainContent.classList.add("active");
                }, 1450);

                setTimeout(() => {
                    if (envelopeWrapper) envelopeWrapper.classList.add("fade-out");
                    document.body.classList.remove("no-scroll");
                }, 2050);
            }

            if (envelopeWrapper) {
                envelopeWrapper.addEventListener("click", playAnimationSequence);
            }

            setTimeout(() => {
                playAnimationSequence();
            }, 500);

            /* 라이트박스 모바일 스와이프 등록 */
            const lightboxModal = document.getElementById("lightboxModal");
            lightboxModal.addEventListener("touchstart", function (e) {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            lightboxModal.addEventListener("touchend", function (e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const swipeDistance = touchEndX - touchStartX;
                const minSwipeDistance = 40;

                if (swipeDistance < -minSwipeDistance) {
                    changeImage(1);
                } else if (swipeDistance > minSwipeDistance) {
                    changeImage(-1);
                }
            }
        });

        /* PC 키보드 방향키 이동 */
        document.addEventListener("keydown", function (e) {
            const modal = document.getElementById("lightboxModal");
            if (modal && modal.classList.contains("active")) {
                if (e.key === "ArrowLeft") {
                    changeImage(-1);
                } else if (e.key === "ArrowRight") {
                    changeImage(1);
                } else if (e.key === "Escape") {
                    closeLightbox();
                }
            }
        });

        const GROOM_DEF = "https://yonizzang.github.io/wedding/images/btn_account_groom_default.png";
        const GROOM_ACT = "https://yonizzang.github.io/wedding/images/btn_account_groom_active.png";
        const BRIDE_DEF = "https://yonizzang.github.io/wedding/images/btn_account_bride_default.png";
        const BRIDE_ACT = "https://yonizzang.github.io/wedding/images/btn_account_bride_active.png";

        function toggleAcc(target) {
            const panelGroom = document.getElementById("panel-groom");
            const panelBride = document.getElementById("panel-bride");
            const imgGroom = document.getElementById("img-btn-groom");
            const imgBride = document.getElementById("img-btn-bride");

            if (target === 'groom') {
                const isOpen = panelGroom.style.maxHeight && panelGroom.style.maxHeight !== "0px";
                if (isOpen) {
                    panelGroom.style.maxHeight = "0px";
                    imgGroom.src = GROOM_DEF;
                } else {
                    panelGroom.style.maxHeight = panelGroom.scrollHeight + "px";
                    imgGroom.src = GROOM_ACT;
                    panelBride.style.maxHeight = "0px";
                    imgBride.src = BRIDE_DEF;
                }
            } else if (target === 'bride') {
                const isOpen = panelBride.style.maxHeight && panelBride.style.maxHeight !== "0px";
                if (isOpen) {
                    panelBride.style.maxHeight = "0px";
                    imgBride.src = BRIDE_DEF;
                } else {
                    panelBride.style.maxHeight = panelBride.scrollHeight + "px";
                    imgBride.src = BRIDE_ACT;
                    panelGroom.style.maxHeight = "0px";
                    imgGroom.src = GROOM_DEF;
                }
            }
        }

        function copyAccount(text, e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                alert('계좌번호 복사에 실패했습니다.');
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById("toast");
            if (toast) {
                toast.classList.add("show");
                setTimeout(function() {
                    toast.classList.remove("show");
                }, 2000);
            }
        }
    </script>
</body>
</html>
